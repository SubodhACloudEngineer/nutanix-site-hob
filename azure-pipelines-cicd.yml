# HOB SITE — CI-CD PIPELINE (DEPLOYS REAL CHANGES)
# ─────────────────────────────────────────────────────────────────────────
# Trigger:  Manual trigger OR merge to main
# Purpose:  Controlled deployment with environment-based approval gate.
#           What the reviewer approves is EXACTLY what gets applied
#           (frozen plan artifact — no re-planning at apply time).
#
# APPROVAL TIERS (Section 8.7.1 of design document):
#   prd — Full team gate, 60-minute timeout
#   acc — Single approver, 30-minute timeout
#   tst — Auto-approve (gate disabled)
#   dev — Auto-approve (gate disabled)
#
# BEFORE RUNNING: ensure the variable group 'nutanix-hob-credentials' exists
# in ADO (Pipelines → Library) and contains:
#   NUTANIX_ENDPOINT         — Prism Central VIP for HOB (OQ NW-02 pending)
#   AZURE_SERVICE_CONNECTION — Azure RM service connection name
#   INFRA_TEAM_EMAIL         — notification address for prd/acc approval gates
# The Prism Central API key is fetched at run time from Azure Key Vault
# (azu-nutanix-kv-prd, secret api-<clusterName>) by the plan and apply step
# templates, not from this variable group. The backend resource group, storage
# account and container are hardcoded in deploy/step-terraform-init.yml
# (AZU-NUTANIX-RG-PRD / azunutanixsaprd / hob), so no BACKEND_* variables are
# required here.
# ─────────────────────────────────────────────────────────────────────────

trigger: none

parameters:
  - name: environment
    displayName: 'Target environment'
    type: string
    default: 'tst'
    values:
      - tst
      - acc
      - dev
      - prd

  - name: moduleVersion
    displayName: 'nutanix_vm module version'
    type: string
    default: '2.0.3'

  - name: clusterName
    displayName: 'Cluster name (lowercase) — selects Key Vault secret api-<clusterName>'
    type: string
    default: 'hob-cl-dev1'

  - name: osType
    displayName: 'Guest OS type (used by the smoke test)'
    type: string
    default: 'linux'
    values:
      - linux
      - windows
      - appliance

  - name: action
    displayName: 'Action'
    type: string
    default: 'apply'
    values:
      - apply
      - destroy

pool:
  name: CCoE_Linux

# TODO: create this variable group in ADO (Pipelines → Library) and link it
# to the Key Vault that holds the HOB credentials before running this pipeline.
variables:
  - group: nutanix-hob-credentials

# ── Stage 1: Plan ─────────────────────────────────────────────────────────────

stages:
  - stage: Plan
    displayName: 'Plan — ${{ parameters.environment }} (${{ parameters.action }})'
    jobs:
      - job: TerraformPlan
        displayName: 'terraform plan'
        steps:
          - checkout: self
            fetchDepth: 0

          - template: deploy/step-terraform-download-module.yml
            parameters:
              moduleVersion: ${{ parameters.moduleVersion }}
              workingDir: $(System.DefaultWorkingDirectory)/infra

          - template: deploy/step-terraform-init.yml
            parameters:
              workingDir: $(System.DefaultWorkingDirectory)/infra
              environment: ${{ parameters.environment }}
              serviceConnectionName: $(AZURE_SERVICE_CONNECTION)

          - template: deploy/step-terraform-plan.yml
            parameters:
              workingDir: $(System.DefaultWorkingDirectory)/infra
              environment: ${{ parameters.environment }}
              varFile: config/${{ parameters.environment }}.tfvars
              planArtifactName: tfplan-hob-${{ parameters.environment }}
              serviceConnectionName: $(AZURE_SERVICE_CONNECTION)
              nutanixEndpoint: $(NUTANIX_ENDPOINT)
              clusterName: ${{ parameters.clusterName }}
              ${{ if eq(parameters.action, 'destroy') }}:
                commandOptions: '-destroy -input=false -out=$(Build.ArtifactStagingDirectory)/tfplan-hob-${{ parameters.environment }}.tfplan -var-file="config/${{ parameters.environment }}.tfvars"'

# ── Stage 2: Approve (environment-based gate) ─────────────────────────────────

  - stage: Approve
    displayName: 'Approve — ${{ parameters.environment }}'
    dependsOn: Plan
    condition: succeeded()
    jobs:
      # prd: full team gate, 60-minute timeout
      - ${{ if eq(parameters.environment, 'prd') }}:
        - job: WaitForApproval
          displayName: 'Awaiting production approval'
          pool: server
          steps:
            - task: ManualValidation@0
              displayName: 'Manual approval — HOB PRODUCTION'
              timeoutInMinutes: 60
              inputs:
                notifyUsers: $(INFRA_TEAM_EMAIL)
                instructions: |
                  Review the plan artifact tfplan-hob-prd. Confirm all
                  10 Nutanix categories are correct, especially Backup (drives Veeam).
                  Confirm cluster and subnet are correct for HOB production.

      # acc: single approver, 30-minute timeout
      - ${{ if eq(parameters.environment, 'acc') }}:
        - job: WaitForApproval
          displayName: 'Awaiting acceptance approval'
          pool: server
          steps:
            - task: ManualValidation@0
              displayName: 'Manual approval — HOB ACCEPTANCE'
              timeoutInMinutes: 30
              inputs:
                notifyUsers: $(INFRA_TEAM_EMAIL)
                instructions: |
                  Review the plan artifact tfplan-hob-acc before approving.
                  Confirm all 10 Nutanix categories are correct, especially Backup (drives Veeam).
                  Confirm cluster and subnet are correct for HOB acceptance.

      # tst/dev: auto-approve — gate is a no-op succeed-immediately job
      - ${{ if or(eq(parameters.environment, 'tst'), eq(parameters.environment, 'dev')) }}:
        - job: AutoApprove
          displayName: 'Auto-approve (${{ parameters.environment }} — gate disabled)'
          steps:
            - bash: echo "Environment ${{ parameters.environment }} does not require manual approval."
              displayName: 'Gate skipped (auto-approve)'

# ── Stage 3: Apply ────────────────────────────────────────────────────────────

  - stage: Apply
    displayName: 'Apply — ${{ parameters.environment }}'
    dependsOn: Approve
    condition: >-
      and(
        succeeded(),
        or(
          eq('${{ parameters.environment }}', 'tst'),
          eq('${{ parameters.environment }}', 'dev'),
          succeeded('Approve')
        )
      )
    jobs:
      - job: TerraformApply
        displayName: 'terraform apply'
        steps:
          - checkout: self

          - template: deploy/step-terraform-download-module.yml
            parameters:
              moduleVersion: ${{ parameters.moduleVersion }}
              workingDir: $(System.DefaultWorkingDirectory)/infra

          - template: deploy/step-terraform-init.yml
            parameters:
              workingDir: $(System.DefaultWorkingDirectory)/infra
              environment: ${{ parameters.environment }}
              serviceConnectionName: $(AZURE_SERVICE_CONNECTION)

          - template: deploy/step-terraform-apply.yml
            parameters:
              workingDir: $(System.DefaultWorkingDirectory)/infra
              planArtifactName: tfplan-hob-${{ parameters.environment }}
              serviceConnectionName: $(AZURE_SERVICE_CONNECTION)
              nutanixEndpoint: $(NUTANIX_ENDPOINT)
              clusterName: ${{ parameters.clusterName }}
              sysprepWin2025: $(SYSPREP_WIN2025)
              sysprepWin2022: $(SYSPREP_WIN2022)

# ── Stage 4: Smoke Test ───────────────────────────────────────────────────────

  - stage: SmokeTest
    displayName: 'Smoke Test — ${{ parameters.environment }}'
    dependsOn: Apply
    condition: >-
      and(
        succeeded(),
        ne('${{ parameters.action }}', 'destroy')
      )
    jobs:
      - job: SmokeTest
        displayName: 'Post-deploy smoke test'
        steps:
          - checkout: self

          # `terraform output` reads from state, so this stage needs the same
          # module download + backend init as plan/apply. Previously it ran
          # `terraform output` with no init and no backend, so both outputs
          # resolved to empty strings and (with continueOnError) the failure was
          # invisible.
          - template: deploy/step-terraform-download-module.yml
            parameters:
              moduleVersion: ${{ parameters.moduleVersion }}
              workingDir: $(System.DefaultWorkingDirectory)/infra

          - template: deploy/step-terraform-init.yml
            parameters:
              workingDir: $(System.DefaultWorkingDirectory)/infra
              environment: ${{ parameters.environment }}
              serviceConnectionName: $(AZURE_SERVICE_CONNECTION)

          - bash: |
              set -e
              cd $(System.DefaultWorkingDirectory)/infra
              VM_NAME=$(terraform output -raw vm_name 2>/dev/null || echo "")
              echo "Detected VM: $VM_NAME"
              echo "##vso[task.setvariable variable=VM_NAME]$VM_NAME"
            displayName: 'Read VM outputs from Terraform state'

          - bash: |
              chmod +x scripts/smoke-test.sh
              # OS type comes from the pipeline parameter (was hardcoded
              # "windows"); this pilot VM is Linux.
              #
              # vm_ip is deliberately NOT passed. The module returns null for it
              # by design: Prism Central only reports a learned guest IP when NGT
              # or an equivalent guest agent is present, and the Rocky
              # GenericCloud image does not ship NGT. The smoke test skips its IP
              # reachability check when no IP is given. Do NOT "fix" this by
              # adding a retry loop — there will never be an IP to reach here.
              set +e
              ./scripts/smoke-test.sh \
                --vm-name     "$(VM_NAME)" \
                --os-type     "${{ parameters.osType }}" \
                --is-override "false"
              rc=$?
              # Keep continueOnError (a smoke-test failure must not roll back a
              # good apply at this stage) but surface the failure explicitly as a
              # warning annotation so it is visible, not silently swallowed.
              if [ "$rc" -ne 0 ]; then
                echo "##vso[task.logissue type=warning]Smoke test failed (exit $rc) — see output above."
              fi
              exit $rc
            displayName: 'Run smoke test (naming check)'
            continueOnError: true
