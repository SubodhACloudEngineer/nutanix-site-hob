parameters:
  - name: workingDir
    type: string
    default: 'infra/'

  - name: environment
    type: string
    displayName: 'Target environment (prd/acc/tst/dev) — prefixes the state key'

  - name: serviceConnectionName
    type: string
    displayName: 'Azure RM service connection name'

steps:
  - task: TerraformInstaller@1
    displayName: 'Install Terraform (1.9.8)'
    inputs:
      # Pinned (not 'latest') so CI resolves the same Terraform build every run.
      terraformVersion: 1.9.8

  - task: TerraformTaskV4@4
    displayName: 'terraform init'
    inputs:
      provider: azurerm
      command: init
      workingDirectory: '${{ parameters.workingDir }}'
      backendServiceArm: '${{ parameters.serviceConnectionName }}'
      # One container per SITE ("hob"); the environment is a prefix in the
      # state key (<environment>/nutanix-site-hob.tfstate).
      # use_azuread_auth=true is required: the service principal has been
      # granted a data-plane RBAC role and shared-key access is expected to be
      # disabled on the storage account, so backend auth must go through
      # Azure AD rather than a storage account key.
      commandOptions: >-
        -backend-config="resource_group_name=AZU-NUTANIX-RG-PRD"
        -backend-config="storage_account_name=azunutanixsaprd"
        -backend-config="container_name=hob"
        -backend-config="key=${{ parameters.environment }}/nutanix-site-hob.tfstate"
        -backend-config="use_azuread_auth=true"
