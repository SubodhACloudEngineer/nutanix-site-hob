parameters:
  - name: moduleVersion
    type: string
    displayName: 'nutanix_vm module version to download'
    default: '2.0.3'

  - name: workingDir
    type: string
    default: '$(System.DefaultWorkingDirectory)/infra'

steps:
  - bash: |
      mkdir -p ${{ parameters.workingDir }}/modules/nutanix_vm
    displayName: 'Create module target directory'

  - task: UniversalPackages@0
    displayName: 'Download nutanix_vm module package'
    inputs:
      command: download
      downloadDirectory: '${{ parameters.workingDir }}/modules'
      # Project-qualified feed. The package lives in the TerraformModules.Nutanix
      # feed in the "Cloud Center of Excellence" project, but THIS repo is in
      # IS.NUTANIXDEV, so the bare feed name would resolve in the wrong project
      # and fail. The download task input is `vstsFeed` (not vstsFeedPublish).
      #
      # The IS.NUTANIXDEV build service ALSO needs read access on this feed:
      # cross-project feed permissions are not automatic, and the failure
      # presents as a 403 at download time rather than a clear permission error.
      #
      # NOTE: the "Project/Feed" display-name syntax is not accepted by every
      # version of UniversalPackages@0 — some require the project GUID instead.
      # If the first run fails with feed-not-found, substitute the GUID.
      vstsFeed: 'Cloud Center of Excellence/TerraformModules.Nutanix'
      vstsPackage: 'nutanix_vm'
      vstsPackageVersion: '${{ parameters.moduleVersion }}'

  - bash: |
      set -e
      cd ${{ parameters.workingDir }}/modules
      unzip -q nutanix_vm.zip -d nutanix_vm_extracted
      mv nutanix_vm_extracted/nutanix_vm/* nutanix_vm/
      rm -rf nutanix_vm_extracted nutanix_vm.zip
    displayName: 'Unpack nutanix_vm module'
