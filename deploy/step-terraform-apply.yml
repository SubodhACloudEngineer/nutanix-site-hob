parameters:
  - name: workingDir
    type: string
    default: 'infra/'

  - name: planArtifactName
    type: string
    default: 'tfplan'

  - name: serviceConnectionName
    type: string
    displayName: 'Azure RM service connection name'

  - name: nutanixEndpoint
    type: string
    displayName: 'Prism Central VIP'

  - name: clusterName
    type: string
    displayName: 'Cluster name (lowercase) selecting the Key Vault secret api-<clusterName>'

  # Windows guest customisation (Sysprep) is deferred and intentionally has no
  # parameters here. It is a template-path feature, and the template path cannot
  # currently apply Nutanix categories in provider 2.4.2 (an open item with
  # Nutanix support). The HOB pilot deploys Linux via cloud-init, which the
  # module wires from infra/main.tf — not from this template.

  - name: sysprepRhel9
    type: string
    displayName: 'Cloud-init userdata for RHEL 9'
    default: ''
    secret: true

  - name: sysprepRhel10
    type: string
    displayName: 'Cloud-init userdata for RHEL 10'
    default: ''
    secret: true

steps:
  - task: DownloadBuildArtifacts@1
    displayName: 'Download approved plan artifact'
    inputs:
      buildType: current
      artifactName: '${{ parameters.planArtifactName }}'
      downloadPath: '$(Build.ArtifactStagingDirectory)'

  # Fetch the Prism Central API key from Azure Key Vault before Terraform runs.
  # Secret convention: api-<cluster-name> (e.g. api-hob-cl-dev1). RBAC:
  # azu-nutanix-kv-prd is RBAC-based; the service connection's service principal
  # needs the "Key Vault Secrets User" role, or this fails with a Forbidden
  # error that looks like a missing secret rather than a missing role.
  - task: AzureKeyVault@2
    displayName: 'Fetch Prism Central API key'
    inputs:
      azureSubscription: '${{ parameters.serviceConnectionName }}'
      KeyVaultName: 'azu-nutanix-kv-prd'
      SecretsFilter: 'api-${{ parameters.clusterName }}'
      RunAsPreJob: false

  - task: TerraformTaskV4@4
    displayName: 'terraform apply'
    inputs:
      provider: azurerm
      command: apply
      workingDirectory: '${{ parameters.workingDir }}'
      # Applying a SAVED plan file needs no approval flag — Terraform applies it
      # directly without prompting, so -auto-approve is omitted (it is only
      # meaningful when planning at apply time, which this stage never does).
      commandOptions: >-
        -input=false
        $(Build.ArtifactStagingDirectory)/${{ parameters.planArtifactName }}/${{ parameters.planArtifactName }}.tfplan
      environmentServiceNameAzureRM: '${{ parameters.serviceConnectionName }}'
    env:
      TF_VAR_nutanix_pc_endpoint: ${{ parameters.nutanixEndpoint }}
      TF_VAR_nutanix_api_key: $(api-${{ parameters.clusterName }})
